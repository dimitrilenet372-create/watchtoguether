<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watch Together</title>
<style>
:root{--bg:#0e0e10;--card:#1c1c1e;--line:#2c2c2e;--fg:#f5f5f7;--mute:#98989f;--acc:#7aa2ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:900px;padding:20px 16px 40px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--mute)}
.pill b{color:var(--fg);font-family:Consolas,monospace;letter-spacing:.04em}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--fg);padding:11px 14px;font:inherit}
button{background:var(--acc);color:#0b1020;border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.frame{position:relative;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.frame>div,.frame iframe{position:absolute;inset:0;width:100%;height:100%}
.empty{display:grid;place-items:center;color:var(--mute);text-align:center;padding:20px}
#status{font-size:13px;color:var(--mute);min-height:1.4em}
body.embed header h1,body.embed #copy{display:none}
body.embed header{justify-content:flex-end}
body.embed{background:#000}
body.embed main{padding:10px 14px 14px;gap:8px;max-width:none}
</style>
</head>
<body>
<main>
  <header>
    <h1>Watch Together</h1>
    <div class="pill">Salon <b id="room"></b> · <span id="peers">seul</span></div>
  </header>
  <div class="row">
    <input id="url" placeholder="Colle un lien YouTube puis clique sur Lancer" autocomplete="off">
    <button id="go">Lancer</button>
  </div>
  <div class="frame"><div id="player"></div><div id="empty" class="empty">Colle un lien YouTube ci-dessus.<br>Ton ami verra la même vidéo, au même moment.</div></div>
  <div class="row">
    <button class="ghost" id="copy">Copier le lien d'invitation</button>
    <button class="ghost" id="sync">Resynchroniser</button>
  </div>
  <div id="status"></div>
</main>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
if (new URLSearchParams(location.search).has("embed")) document.body.classList.add("embed");
const SERVER = "https://ntfy.sh";
const ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const $ = id => document.getElementById(id);
const myId = Math.random().toString(36).slice(2, 10);

let room = location.hash.slice(1).toUpperCase().replace(/[^A-Z0-9]/g, "");
if (room.length < 8) {
  const a = crypto.getRandomValues(new Uint8Array(12));
  room = Array.from(a, x => ALPHA[x % ALPHA.length]).join("");
  history.replaceState(null, "", "#" + room);
}
$("room").textContent = room.slice(0,4) + "-" + room.slice(4,8) + "-" + room.slice(8);
const topic = SERVER + "/watchtogether-" + room.toLowerCase();

const peers = new Set();
function showPeers(){ $("peers").textContent = peers.size ? (peers.size + 1) + " personnes" : "seul"; }
function say(t){ $("status").textContent = t; }

// ---- relais ntfy ----
let lastSend = 0, queue = Promise.resolve();
function send(obj, keepalive){
  queue = queue.then(async () => {
    const wait = 500 - (Date.now() - lastSend);
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
    lastSend = Date.now();
    try { await fetch(topic, { method: "POST", body: JSON.stringify(obj), keepalive: !!keepalive }); }
    catch { say("Connexion au relais impossible."); }
  });
}
const es = new EventSource(topic + "/sse");
es.onopen = () => { say("Connecté."); send({ t: "hello", id: myId }); };
es.onerror = () => say("Reconnexion…");
es.onmessage = ev => {
  try {
    const m = JSON.parse(JSON.parse(ev.data).message);
    if (!m || m.id === myId) return;
    if (m.t === "leave") { peers.delete(m.id); showPeers(); return; }
    peers.add(m.id); showPeers();
    if (m.t === "hello") broadcast();
    else if (m.t === "state") applyRemote(m);
  } catch {}
};
addEventListener("pagehide", () => send({ t: "leave", id: myId }, true));

// ---- lecteur YouTube ----
let yt = null, ready = false, vid = "", suppressUntil = 0, lastPos = 0, lastAt = 0, lastPlaying = false;
window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player("player", {
    playerVars: { playsinline: 1, rel: 0, origin: location.origin },
    events: { onReady: () => { ready = true; if (pendingState) { const m = pendingState; pendingState = null; applyRemote(m); } }, onStateChange: onYtState,
      onError: e => say("Cette vidéo ne peut pas être lue ici (code " + e.data + "). Essaie une autre vidéo.") }
  });
};
function parseId(u){
  const m = u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(u.trim()) ? u.trim() : "");
}
function load(id, pos = 0, autoplay = true){
  vid = id;
  $("empty").style.display = "none";
  if (autoplay) yt.loadVideoById(id, pos); else yt.cueVideoById(id, pos);
}
$("go").onclick = () => {
  const id = parseId($("url").value);
  if (!id) return say("Lien YouTube non reconnu.");
  if (!ready) return say("Le lecteur charge, réessaie dans une seconde.");
  suppressUntil = Date.now() + 1500;
  load(id, 0, true);
  setTimeout(broadcast, 1200);
};
function snapshot(){
  const playing = yt.getPlayerState() === 1;
  return { t: "state", id: myId, vid, playing, pos: +yt.getCurrentTime().toFixed(2), ts: Date.now() };
}
function broadcast(){ if (ready && vid) send(snapshot()); }
function onYtState(e){
  if (Date.now() < suppressUntil || !vid) return;
  if (e.data === 1 || e.data === 2) broadcast();
}
// détection d'un saut dans la timeline
setInterval(() => {
  if (!ready || !vid) return;
  const now = Date.now(), pos = yt.getCurrentTime(), playing = yt.getPlayerState() === 1;
  const expected = lastPlaying ? lastPos + (now - lastAt) / 1000 : lastPos;
  if (now > suppressUntil && lastAt && Math.abs(pos - expected) > 2.5) broadcast();
  lastPos = pos; lastAt = now; lastPlaying = playing;
}, 500);

let pendingState = null;
function applyRemote(m){
  if (!ready) { pendingState = m; return; }   // lecteur pas encore chargé : on garde le dernier état reçu
  const isYt = m.vid && m.vid.length === 11;
  if (!vid && !isYt) return;                  // rien à synchroniser (message venu de Notch, sans id YouTube)
  const elapsed = m.playing ? Math.min(5, Math.max(0, (Date.now() - m.ts) / 1000)) : 0;
  const target = m.pos + elapsed;
  suppressUntil = Date.now() + 2500;
  if (isYt && m.vid !== vid) { load(m.vid, target, m.playing); say("Vidéo changée par ton ami."); return; }
  if (Math.abs(yt.getCurrentTime() - target) > 1.2) yt.seekTo(target, true);
  const cur = yt.getPlayerState() === 1;
  if (m.playing && !cur) yt.playVideo();
  if (!m.playing && cur) yt.pauseVideo();
}
$("sync").onclick = () => { suppressUntil = 0; broadcast(); say("État envoyé."); };
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); say("Lien copié, envoie-le à ton ami."); }
  catch { prompt("Copie ce lien :", location.href); }
};
</script>
</body>
</html>
